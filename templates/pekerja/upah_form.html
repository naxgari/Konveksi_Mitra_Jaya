
{{define "content"}}

<div class="page-head clearfix">
    <h3 class="float-left">{{.Judul}}</h3>

    <a href="/pekerja/{{.Pekerja.ID}}/upah"
       class="btn btn-light float-right">
        Kembali
    </a>
</div>

<div>
    <p>
        <strong>Nama Pekerja:</strong>
        {{.Pekerja.Nama}}
    </p>

    <p>
        <strong>Jenis Pekerja:</strong>
        {{.Pekerja.JenisPekerja}}
    </p>

    <p>
        <strong>Jabatan:</strong>
        {{.Pekerja.Jabatan}}
    </p>
</div>

{{if .PesanError}}
<div role="alert"
     style="
        padding: 14px 18px;
        margin: 20px 0;
        background-color: #fef2f2;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        color: #991b1b;
     ">
    <strong>Data tidak dapat disimpan.</strong>
    <div>{{.PesanError}}</div>
</div>
{{end}}

<form method="POST" action="{{.Action}}">

    <div class="form-group">
        <label for="berlaku_mulai">
            Tanggal Mulai Berlaku
        </label>

        <input
            type="date"
            id="berlaku_mulai"
            name="berlaku_mulai"
            class="form-control"
            value="{{.TanggalBerlaku}}"
            min="{{.Pekerja.TanggalMasuk.Format "2006-01-02"}}"
            {{if .Pekerja.TanggalKeluar}}
            max="{{.Pekerja.TanggalKeluar.Format "2006-01-02"}}"
            {{end}}
            required>
    </div>

    <div class="form-group">
        <label for="nominal">
            Nominal Upah (Rp)
        </label>

        <input
            type="number"
            id="nominal"
            name="nominal"
            class="form-control"
            min="0.01"
            max="9999999999999.99"
            step="0.01"
            value="{{.Nominal}}"
            placeholder="Contoh: 100000"
            required>
    </div>

    <div class="form-group">
        <label for="keterangan">
            Keterangan
        </label>

        <textarea
            id="keterangan"
            name="keterangan"
            class="form-control"
            rows="3"
            placeholder="Contoh: Tarif upah awal atau penyesuaian upah">{{.Keterangan}}</textarea>
    </div>

    <div class="form-group">
        <button type="submit" class="btn">
            Simpan Riwayat Upah
        </button>

        <a href="/pekerja/{{.Pekerja.ID}}/upah"
           class="btn btn-light">
            Batal
        </a>
    </div>

</form>

{{end}}
