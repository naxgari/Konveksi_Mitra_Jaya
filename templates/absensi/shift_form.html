{{define "content"}}
<section class="dashboard"><div class="page-head"><h1>{{.Judul}}</h1><p class="subtitle">Jam akhir harus setelah jam mulai. Shift yang sudah dipakai jadwal tidak dapat diubah atau dihapus.</p></div>{{if .Error}}<p class="notice warning" role="alert">{{.Error}}</p>{{end}}<form class="panel dialog-form" method="post" action="{{.Action}}"><label>Nama shift<input class="form-control" name="nama" value="{{.Nama}}" maxlength="50" required></label><label>Jam mulai<input class="form-control" type="time" name="mulai" value="{{.JamMulai}}" required></label><label>Jam selesai<input class="form-control" type="time" name="selesai" value="{{.JamSelesai}}" required></label><div class="dialog-actions"><a class="btn btn-light" href="/shift">Batal</a><button class="btn" type="submit">Simpan</button></div></form></section>
{{end}}
