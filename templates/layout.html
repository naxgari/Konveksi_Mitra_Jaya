{{define "layout"}}
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Konveksi Mitra Jaya — Sistem Penggajian</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                height: 100%;
            }
            body {
                font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-size: 15px;
                line-height: 1.6;
                color: #2d3436;
                /* warna kolom sidebar dibuat dari background body agar tingginya selalu penuh */
                background: linear-gradient(to right, #f5f6f8 235px, #ffffff 235px);
            }
            body.guest-body {
                background: #f5f6f8;
            }
            a {
                color: #2c5282;
                text-decoration: none;
            }

            /* ===== Header ===== */
            header {
                height: 64px;
                padding: 0 24px;
                background-color: #1f2a3a;
                border-bottom: 3px solid #c9a227;
                color: #ffffff;
            }
            header .brand {
                float: left;
                font-size: 19px;
                font-weight: 600;
                line-height: 61px;
                letter-spacing: 0.4px;
                color: #ffffff;
            }
            header .tagline {
                float: left;
                margin-left: 14px;
                padding-left: 14px;
                border-left: 1px solid #4a5568;
                font-size: 13px;
                line-height: 61px;
                color: #a0aec0;
            }
            header .user-bar {
                float: right;
                display: flex;
                align-items: center;
                gap: 12px;
                height: 61px;
                font-size: 13px;
            }
            header .user-bar .user-name {
                font-weight: 600;
                color: #e2e8f0;
            }
            header .user-bar form {
                margin: 0;
            }

            /* ===== Sidebar ===== */
            aside {
                float: left;
                width: 235px;
                padding: 18px 0;
            }
            aside .menu-title {
                padding: 12px 24px 6px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #8a94a6;
            }
            aside .menu-title:first-child {
                padding-top: 0;
            }
            aside ul {
                list-style: none;
                margin-bottom: 8px;
            }
            aside li a {
                display: block;
                padding: 8px 24px;
                border-left: 3px solid transparent;
                color: #2d3436;
                font-size: 14px;
            }
            aside li a:hover {
                background-color: #e9ecf1;
                border-left-color: #c9a227;
                color: #1f2a3a;
            }

            /* ===== Konten ===== */
            main {
                display: flow-root;
                margin-left: 235px;
                padding: 28px 32px;
                min-height: calc(100vh - 115px);
            }
            body.guest-body main {
                margin-left: 0;
                max-width: 520px;
                margin-right: auto;
                margin-left: auto;
                padding: 40px 20px;
            }
            main h1, main h2, main h3, main h4 {
                margin-bottom: 12px;
                color: #1f2a3a;
            }
            main p {
                margin-bottom: 12px;
            }
            main ul, main ol {
                margin: 0 0 12px 22px;
            }

            /* ===== Alert & Notifikasi ===== */
            .alert {
                padding: 11px 14px;
                margin-bottom: 16px;
                border-radius: 4px;
                border: 1px solid transparent;
                font-size: 14px;
            }
            .alert-danger {
                background-color: #fdf2f2;
                border-color: #f5c6cb;
                color: #9b1c1c;
            }
            .alert-success {
                background-color: #f0fdf4;
                border-color: #bbf7d0;
                color: #166534;
            }
            .alert-info {
                background-color: #eff6ff;
                border-color: #bfdbfe;
                color: #1e40af;
            }
            .alert-warning {
                background-color: #fffbeb;
                border-color: #fde68a;
                color: #92400e;
            }

            /* ===== Badge Peran & Status ===== */
            .badge {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 3px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }
            .badge-admin {
                background-color: #c9a227;
                color: #1f2a3a;
            }
            .badge-supervisor {
                background-color: #3182ce;
                color: #ffffff;
            }
            .badge-pemilik {
                background-color: #2f855a;
                color: #ffffff;
            }
            .badge-success {
                background-color: #dcfce7;
                color: #166534;
            }
            .badge-warning {
                background-color: #fef3c7;
                color: #92400e;
            }
            .badge-danger {
                background-color: #fee2e2;
                color: #991b1b;
            }

            /* ===== Kartu Ringkasan Dashboard ===== */
            .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
                margin-bottom: 24px;
            }
            .card {
                padding: 18px 20px;
                background-color: #ffffff;
                border: 1px solid #e2e6ea;
                border-top: 3px solid #1f2a3a;
                border-radius: 4px;
            }
            .card-gold {
                border-top-color: #c9a227;
            }
            .card .card-label {
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                color: #64748b;
                margin-bottom: 4px;
            }
            .card .card-value {
                font-size: 26px;
                font-weight: 700;
                color: #1f2a3a;
                line-height: 1.2;
            }
            .card .card-sub {
                margin-top: 6px;
                font-size: 12px;
                color: #8a94a6;
            }
            .auth-box {
                background-color: #ffffff;
                border: 1px solid #e2e6ea;
                border-top: 4px solid #c9a227;
                border-radius: 6px;
                padding: 28px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            }

            /* ===== Tabel: <table class="table"> ===== */
            .table {
                width: 100%;
                margin-bottom: 16px;
                border-collapse: collapse;
                font-size: 14px;
            }
            .table th,
            .table td {
                padding: 10px 12px;
                border-bottom: 1px solid #e2e6ea;
                text-align: left;
                vertical-align: top;
            }
            .table th {
                background-color: #f5f6f8;
                border-bottom: 2px solid #d5dae1;
                font-weight: 600;
                color: #1f2a3a;
            }
            .table tbody tr:nth-child(even) {
                background-color: #fafbfc;
            }
            .table tbody tr:hover {
                background-color: #fdf8e8;
            }
            .table .num {
                text-align: right;
            }

            /* ===== Tombol: <a class="btn"> / <button class="btn"> ===== */
            .btn {
                display: inline-block;
                padding: 7px 16px;
                border: 1px solid #1f2a3a;
                border-radius: 4px;
                background-color: #1f2a3a;
                color: #ffffff;
                font-family: inherit;
                font-size: 14px;
                line-height: 1.4;
                cursor: pointer;
            }
            .btn:hover {
                background-color: #2f3f56;
                border-color: #2f3f56;
            }
            .btn-light {
                background-color: #ffffff;
                color: #1f2a3a;
                border-color: #d5dae1;
            }
            .btn-light:hover {
                background-color: #f5f6f8;
                border-color: #d5dae1;
            }
            .btn-sm {
                padding: 4px 10px;
                font-size: 13px;
            }
            .btn-danger {
                background-color: #ffffff;
                color: #c0392b;
                border-color: #e3b5b0;
            }
            .btn-danger:hover {
                background-color: #c0392b;
                border-color: #c0392b;
                color: #ffffff;
            }

            /* kelompok tombol aksi di kolom tabel */
            .actions {
                display: flex;
                gap: 6px;
                align-items: center;
                white-space: nowrap;
            }
            .actions form {
                margin: 0;
            }

            /* ===== Form: <form class="form"> ===== */
            .form {
                max-width: 480px;
            }
            .form-full {
                max-width: 100%;
            }
            .form-group {
                margin-bottom: 16px;
            }
            .form-group label {
                display: block;
                margin-bottom: 6px;
                font-size: 14px;
                font-weight: 600;
                color: #1f2a3a;
            }
            .form-control {
                display: block;
                width: 100%;
                padding: 8px 10px;
                border: 1px solid #d5dae1;
                border-radius: 4px;
                background-color: #ffffff;
                color: #2d3436;
                font-family: inherit;
                font-size: 14px;
            }
            .form-control:focus {
                outline: none;
                border-color: #c9a227;
                box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
            }
            .form-hint {
                margin-top: 4px;
                font-size: 12px;
                color: #8a94a6;
            }
            .form-actions {
                margin-top: 24px;
                padding-top: 16px;
                border-top: 1px solid #e2e6ea;
            }
            .form-actions .btn {
                margin-right: 8px;
            }

            /* ===== Positioning ===== */
            .float-left  { float: left; }
            .float-right { float: right; }
            .clearfix::after {
                content: "";
                display: table;
                clear: both;
            }
            .page-head {
                margin-bottom: 16px;
            }
            main .page-head h3 {
                margin: 0;
                line-height: 34px;
            }

            /* ===== Footer ===== */
            footer {
                clear: both;
                height: 48px;
                padding: 0 24px;
                background-color: #1f2a3a;
                color: #a0aec0;
                font-size: 13px;
                line-height: 48px;
                text-align: center;
            }

            @media print {
                header, aside, footer, .no-print {
                    display: none !important;
                }
                body {
                    background: #ffffff !important;
                }
                main {
                    margin-left: 0 !important;
                    padding: 0 !important;
                }
            }
        </style>
    </head>

    <body {{if not currentUser}}class="guest-body"{{end}}>
        <header>{{template "header" .}}</header>
        {{if currentUser}}
        <aside>{{template "sidebar" .}}</aside>
        {{end}}
        <main>{{template "content" .}}</main>
        <footer>{{template "footer" .}}</footer>
    </body>
</html>
{{end}}
